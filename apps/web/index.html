<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>effect-flue chat</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 16px;
        max-width: 1400px;
        margin-inline: auto;
        background: #fafafa;
        color: #111;
      }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .messages {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .message {
        padding: 8px 12px;
        border-radius: 6px;
        max-width: 100%;
        white-space: pre-wrap;
      }
      .message-user {
        background: #dbeafe;
        align-self: flex-end;
      }
      .message-assistant {
        background: #f1f5f9;
        align-self: flex-start;
      }
      .role {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: 2px;
      }
      .composer {
        display: flex;
        gap: 8px;
      }
      .composer input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
      }
      .composer button {
        padding: 8px 16px;
        border: none;
        background: #2563eb;
        color: white;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      .composer button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .error {
        color: #b91c1c;
        font-size: 13px;
      }
      .pending {
        opacity: 0.7;
        font-style: italic;
      }
      .streaming-cursor {
        display: inline-block;
        width: 0.5ch;
        margin-left: 1px;
        background: currentColor;
        opacity: 0.8;
        animation: streaming-cursor-blink 1s steps(2, start) infinite;
        vertical-align: -2px;
        height: 1em;
      }
      @keyframes streaming-cursor-blink {
        to {
          visibility: hidden;
        }
      }
      .thinking-dots::after {
        content: "";
        display: inline-block;
        animation: thinking-dots 1.2s steps(4, end) infinite;
        width: 1.5em;
        text-align: left;
        vertical-align: bottom;
      }
      @keyframes thinking-dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }
      .message-streaming {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
